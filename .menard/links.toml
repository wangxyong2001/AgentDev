# =============================================================================
# menard links.toml — 代码段 → 文档章节 映射表
#
# 格式: "<文件>:<行范围或符号>" = ["<文档>:<章节锚点>", ...]
#
# 当指定代码段在 git diff 中发生变化时, menard 会将对应的文档章节标记为"过期",
# 阻止 commit 直到文档被更新。
#
# 行范围格式:
#   "file:L1-L2" = 第 L1 行到第 L2 行
#   "file:SYMBOL" = 符号引用 (函数/类/常量名), 由 check_docs.py 解析
# =============================================================================

